<text x="61" y="136" font-size="19" style="fill:#284c85" font-weight="600">Hermes scheduling (planned)  |  configurable collection  |  daily analysis + serve delivery</text>
<rect x="40" y="185" width="210" height="104" rx="14" fill="#fff" stroke="#dbe3ed" stroke-width="1.4"/>
