<rect x="580" y="201" width="4" height="72" rx="2" fill="#f59e0b"/>
<text x="602" y="220" font-size="23" font-weight="700">Deterministic collector</text>
<text x="602" y="248" font-size="17" class="muted">Thin project code: bounded requests, normalize, exact dedupe</text>
<text x="602" y="272" font-size="17" class="muted">No LLM browser loop; preserve query + source provenance</text>
