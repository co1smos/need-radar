<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1230" viewBox="0 0 1680 1230" role="img" aria-labelledby="title desc">
<title id="title">Need Radar system architecture</title>
<desc id="desc">A shared deterministic acquisition pipeline freezes one input snapshot. Serve and shadow change extraction only. Serve creates the Markdown report and deterministic HTML, PDF and Discord outputs. An isolated fixed judge compares both arms without blocking serving. End-to-end observability traces deterministic code and LLM calls.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker><marker id="dotarrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#94a3b8"/></marker></defs>
<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#172338}.muted{fill:#526176}.small{font-size:15px}.body{font-size:18px}.label{font-size:23px;font-weight:700}.mono{font-family:DejaVu Sans Mono,monospace}.flow{fill:none;stroke:#64748b;stroke-width:2.2;marker-end:url(#arrow)}.telemetry{fill:none;stroke:#94a3b8;stroke-width:1.8;stroke-dasharray:6 5;marker-end:url(#dotarrow)}</style>
